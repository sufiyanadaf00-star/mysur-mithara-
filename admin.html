<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mysuru Mithra | Team Feedback</title><link rel="stylesheet" href="style_updated.css"><style>
.admin-page{max-width:900px;margin:0 auto;background:#f8edda;min-height:100vh;padding:25px 16px 50px}.admin-card{background:#fff7e7;border:1px solid #d4a45a;border-radius:22px;padding:22px;box-shadow:0 5px 14px rgba(75,40,15,.09);margin-top:18px}.admin-logo{display:block;width:180px;max-width:70%;margin:0 auto}.admin-title{text-align:center;color:#713b20;font-family:"Playfair Display",Georgia,serif}.admin-input{width:100%;padding:12px;border:1px solid #d5a04a;border-radius:18px;margin:7px 0;background:white}.admin-btn{border:0;border-radius:20px;padding:11px 18px;background:#713b20;color:#fff8e9;font-weight:700;cursor:pointer}.admin-btn.secondary{background:#fff;border:1px solid #c99439;color:#713b20}.admin-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:16px;text-align:center;background:#fffaf0;border:1px solid #d8b06a;border-radius:16px}.stat b{display:block;font-size:26px;color:#713b20}.table-wrap{overflow:auto}.feedback-table{width:100%;border-collapse:collapse;font-size:12px}.feedback-table th,.feedback-table td{padding:10px;border-bottom:1px solid #decfb8;text-align:left;vertical-align:top}.feedback-table th{color:#713b20}.private-note{text-align:center;color:#765538;font-size:11px}.hidden{display:none!important}@media(max-width:600px){.admin-stats{grid-template-columns:1fr}.feedback-table{font-size:11px}}
</style></head><body><main class="admin-page"><a href="index.html"><img src="logo.png" class="admin-logo" alt="Mysuru Mithra"></a><h1 class="admin-title">TEAM FEEDBACK DASHBOARD</h1><p class="private-note">Private view — only your authenticated team account can see student records.</p><section class="admin-card" id="loginCard"><h2>Team Login</h2><input class="admin-input" id="email" type="email" placeholder="Team email"><input class="admin-input" id="password" type="password" placeholder="Password"><button class="admin-btn" id="loginBtn">LOGIN</button><p id="loginStatus"></p></section><section class="admin-card hidden" id="dash"><div class="admin-row"><h2>Feedback Records</h2><div><button class="admin-btn secondary" id="refreshBtn">REFRESH</button> <button class="admin-btn secondary" id="logoutBtn">LOG OUT</button></div></div><div class="admin-stats" id="stats"></div><div class="table-wrap"><table class="feedback-table"><thead><tr><th>Date</th><th>Name</th><th>Dish</th><th>Rating</th><th>Review</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
