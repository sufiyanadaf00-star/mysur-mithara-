<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mysuru Mithra QR Maker</title><style>body{font-family:Arial,sans-serif;background:#f8edda;color:#32190d;max-width:600px;margin:40px auto;padding:20px;text-align:center}input{width:100%;padding:14px;border:1px solid #c59a51;border-radius:10px;font-size:16px}button{margin:12px;padding:12px 20px;border:0;border-radius:20px;background:#713b20;color:white;font-weight:bold;cursor:pointer}#qrcode{margin:25px auto;width:260px}</style></head><body><h1>Mysuru Mithra QR Code</h1><p>After hosting your main website, paste its public URL below.</p><input id="url" placeholder="https://your-host.com/..."><button onclick="makeQR()">MAKE QR CODE</button><div id="qrcode"></div><p>Right-click the QR code and save it, then print it on your event poster.</p><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>function makeQR(){const u=document.getElementById('url').value.trim();if(!u)return;document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:u,width:260,height:260,correctLevel:QRCode.CorrectLevel.H});}</script></body></html>
